name: "pipeline"

on:
  push:
    branches: [main]

concurrency: 
  group: ci-{{github.ref}}
  cancel-in-progress: true

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 20
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test: 
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 20
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  typecheck: 
    name: Healthcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 20
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  
  
  