name: "pipeline"

on:
  push:
    branches: [main]

concurrency: 
  group: ci-{{github.ref}}
  cancel-in-progress: true

jobs:
  install:
    name: Instalar Dependencias
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@latest --activate

      - run: pnpm install --frozen-lockfile
    